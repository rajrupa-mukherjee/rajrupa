    <script>
        const navbar = document.getElementById('mainNavbar');
        const hero   = document.getElementById('heroSection');

        function adjustHero() {
            hero.style.marginTop = navbar.offsetHeight + 'px';
        }

        window.addEventListener('load', adjustHero);
        adjustHero();
        window.addEventListener('resize', adjustHero);
        document.getElementById('navbarContent').addEventListener('shown.bs.collapse',  adjustHero);
        document.getElementById('navbarContent').addEventListener('hidden.bs.collapse', adjustHero);

        // Navbar scroll effect
        window.addEventListener('scroll', function () {
            if (window.scrollY > 50) {
                navbar.classList.add('shadow-sm');
                navbar.style.background = 'rgba(255, 255, 255, 0.95)';
            } else {
                navbar.classList.remove('shadow-sm');
                navbar.style.background = 'rgba(255, 255, 255, 0.85)';
            }
        });

        // Filter Logic
        function filterGallery(category, btn) {
            document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const items = document.querySelectorAll('.gallery-item');
            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                    item.style.opacity = 0;
                    setTimeout(() => item.style.opacity = 1, 50);
                } else {
                    item.style.display = 'none';
                }
            });
        }

        // Modal Logic
        function openModal(element) {
            const img = element.querySelector('img').src;
            document.getElementById('modalImg').src = img;
            document.getElementById('modalCaption').innerText = '';
            var myModal = new bootstrap.Modal(document.getElementById('imageModal'));
            myModal.show();
        }
    </script>
